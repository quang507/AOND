name: Apply Database Migration on Supabase

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: Tên file migration trong bot/supabase/migrations/ (gõ đúng tên, không có mặc định). Bỏ trống khi chạy dung_lai
        required: false
        # 30/09/2026: từng mặc định '20260908c_chuan_hoa_ma_tin_va_boc_thong_so.sql' — bấm chạy để nguyên ô là ÁP LẠI file
        # 08/09, đè boc_thong_so / next_listing_code / listing_photos_v bằng bản cũ (phải khôi phục bằng 20260930b).
        default: ''
      ap_lai:
        description: File đã có trong sổ migration mà vẫn muốn áp lại (đè hàm bằng bản trong file)? Gõ đúng chữ "ap lai".
        required: false
        default: ''
      dung_lai:
        description: "DỰNG LẠI DB trên project rỗng (08/10/2026, scripts/dung-lai-db.mjs): kiem | cau-truc | bu | du-lieu | xac-minh | nap-du-an | nap-duong | nap-giao-lo | cai-vps | go-trang-thu | ban-thu-mua | ban-thu-ban | ban-thu-kb | ban-thu-dc | ban-thu-sau | ban-thu-xa | ban-thu-nhieu-can | ban-thu-dap-y | doc-log-loi | ban-thu-vm | do-tim-nha | nap-tin-mau. Trống = áp migration_file như thường"
        required: false
        default: ''
      commit_schema:
        description: Sau khi áp, COMMIT bot/supabase/schema.sql vừa xuất lên đúng nhánh đang chạy (phiên không có service_role không tải được artifact). Gõ đúng chữ "commit".
        required: false
        default: ''

env:
  PROJECT_REF: rqxmmqmctpklqcmbfxuj
  # Khoá publishable (công khai, như lib/supabase.ts) — dung-lai-db.mjs ghi vào app_config.publishable_key.
  PUBLISHABLE_KEY: sb_publishable_f4wNO8jQcCDWn1QmNZQ7-g_BXDtYM3Y

jobs:
  migrate:
    name: Apply Migration
    runs-on: ubuntu-latest
    # 05/10/2026: cần quyền ghi để bước cuối commit schema.sql về nhánh (chỉ khi commit_schema = "commit").
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Che token trong log
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Thiếu SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

      # 08/10/2026: nạp dữ liệu tham chiếu cần service_role (kho dự án, từ điển tên đường). Khoá lấy qua Management API
      # bằng chính token này lúc chạy, che trong log, chỉ ghi vào scripts/.env TRÊN MÁY RUNNER (gitignore, không commit).
      - name: Nạp dữ liệu (nap-du-an / nap-duong)
        if: ${{ inputs.dung_lai == 'nap-du-an' || inputs.dung_lai == 'nap-duong' || inputs.dung_lai == 'nap-giao-lo' || inputs.dung_lai == 'nap-anh-mau' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          BUOC: ${{ inputs.dung_lai }}
        run: |
          set -euo pipefail
          K=$(curl -sS -f "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -H "Authorization: Bearer $TOKEN" \
              | jq -r '([.[] | select(.name == "service_role" and (.api_key // "") != "")][0].api_key) // ([.[] | select(.type == "secret" and (.api_key // "") != "")][0].api_key) // empty')
          if [ -z "$K" ]; then echo "::error::Không lấy được khoá service_role / secret"; exit 1; fi
          echo "::add-mask::$K"
          umask 077
          printf 'SUPABASE_URL=https://%s.supabase.co\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$PROJECT_REF" "$K" > scripts/.env
          # Log job phiên Claude không đọc được — 40 dòng cuối (tên đường / dự án công khai, không có khoá) ra một annotation.
          rc=0
          case "$BUOC" in
            nap-du-an) node scripts/thu-du-an.mjs > /tmp/nap.log 2>&1 || rc=$? ;;
            nap-giao-lo) node scripts/nap-giao-lo.mjs --thieu > /tmp/nap.log 2>&1 || rc=$? ;;
            nap-anh-mau) node bot/tests/tim-nha/nap-anh-mau.mjs > /tmp/nap.log 2>&1 || rc=$? ;;   # SRS-5.1zzzzzzz168: ảnh minh hoạ cho tin mẫu seed_thu
            *) node scripts/nap-duong.mjs --thieu > /tmp/nap.log 2>&1 || rc=$? ;;
          esac
          rm -f scripts/.env
          cat /tmp/nap.log
          echo "::notice title=nap $BUOC (thoát $rc)::$(tail -40 /tmp/nap.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit $rc

      # 09/10/2026: cài / cập nhật bridge Zalo clone trên VPS khi chủ dự án không tự SSH được. Thông tin VPS và
      # BRIDGE_SECRET nằm trong Supabase Vault (VPS_HOST, VPS_ROOT_PASSWORD đặt tạm), đọc qua Management API, che trong
      # log, BRIDGE_SECRET đi qua stdin (không nằm trên dòng lệnh). Log không in link / ảnh QR — ai cầm QR là đăng nhập
      # được bridge; QR đọc ở bảng bridge_dang_nhap (chỉ admin). Bước sau luôn GHI ĐÈ VPS_ROOT_PASSWORD + VPS_HOST trong Vault
      # (DELETE trên vault.secrets qua Management API bị từ chối — lượt 09/10 thoát 22; update_secret thì được).
      - name: Cài bridge Zalo trên VPS (cai-vps)
        if: ${{ inputs.dung_lai == 'cai-vps' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          q() { curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg q "$1" '{query:$q}')"; }
          # 22/10/2026 (SRS-5.1zzzzzzz134): kéo luôn khoá Gemini chat (GEMINI_API_KEY, _2, _3, _4) — cai-vps.sh ghi vào .env lõi.
          J=$(q "select json_object_agg(name, decrypted_secret) as s from vault.decrypted_secrets where name in ('VPS_HOST','VPS_ROOT_PASSWORD','BRIDGE_SECRET','GEMINI_API_KEY','GEMINI_API_KEY_2','GEMINI_API_KEY_3','GEMINI_API_KEY_4','ANTHROPIC_API_KEY')")
          HOST=$(jq -r '.[0].s.VPS_HOST // empty' <<<"$J"); PW=$(jq -r '.[0].s.VPS_ROOT_PASSWORD // empty' <<<"$J"); BS=$(jq -r '.[0].s.BRIDGE_SECRET // empty' <<<"$J")
          GK=$(jq -r '[.[0].s.GEMINI_API_KEY, .[0].s.GEMINI_API_KEY_2, .[0].s.GEMINI_API_KEY_3, .[0].s.GEMINI_API_KEY_4] | map(select(. != null and . != "")) | join(",")' <<<"$J")
          AK=$(jq -r '.[0].s.ANTHROPIC_API_KEY // empty' <<<"$J")   # SRS-5.1zzzzzzz135: khoá Claude cũng một nguồn Vault → .env lõi
          unset J
          for v in "$HOST" "$PW" "$BS" "$AK" ${GK//,/ }; do [ -n "$v" ] && echo "::add-mask::$v"; done
          echo "Khoá Gemini chat từ Vault: $(awk -F, '{print ($0==""?0:NF)}' <<<"$GK")"
          if [ -z "$HOST" ] || [ -z "$PW" ] || [ -z "$BS" ]; then echo "::error::Thiếu VPS_HOST / VPS_ROOT_PASSWORD / BRIDGE_SECRET trong Vault"; exit 1; fi
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$PW"
          rc=0
          # 10/10/2026 (SRS-5.1zzzzs): cài ĐÚNG nhánh workflow đang chạy (trước luôn lấy main) — bản sửa bridge lên VPS được
          # trước khi merge. Tên nhánh chỉ nhận ký tự an toàn vì nó đi vào lệnh chạy trên VPS.
          NHANH_VPS="$GITHUB_REF_NAME"
          if ! printf '%s' "$NHANH_VPS" | grep -Eq '^[A-Za-z0-9._/-]+$'; then echo "::error::Tên nhánh lạ: $NHANH_VPS"; exit 1; fi
          # 18/10/2026: lượt cài hỏng (git checkout / quyền .git) vẫn báo xanh — lệnh từ xa thoát theo mã của `tail` cuối chuỗi. Nay giữ
          # mã thoát của cai-vps.sh (rc_cai) và in commit + origin đang chạy để thấy VPS đã lên code mới chưa.
          # 19/10 (SRS-5.1zzzzzzz58): script tải theo $GITHUB_SHA — CDN raw giữ bản cũ theo tên nhánh vài phút sau merge.
          printf '%s\n%s\n%s\n' "$BS" "$GK" "$AK" | sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 "root@$HOST" \
            "read -r BRIDGE_SECRET; read -r GEMINI_API_KEYS_MOI; read -r ANTHROPIC_KEY_MOI; export BRIDGE_SECRET GEMINI_API_KEYS_MOI ANTHROPIC_KEY_MOI; curl -fsSL https://raw.githubusercontent.com/quang507/AOND/$GITHUB_SHA/bot/bridge-zca/cai-vps.sh -o /root/cai-vps.sh && NHANH='$NHANH_VPS' bash /root/cai-vps.sh </dev/null; rc_cai=\$?; unset BRIDGE_SECRET GEMINI_API_KEYS_MOI ANTHROPIC_KEY_MOI; sleep 25; echo \"== service: \$(systemctl is-active nhadat-bridge)\"; echo \"== code: \$(sudo -u nhadat git -C /opt/nhadat rev-parse --short HEAD) \$(sudo -u nhadat git -C /opt/nhadat remote get-url origin)\"; journalctl -u nhadat-bridge -n 40 --no-pager -o cat | grep -viE 'qr-|http://|https://' | tail -25; echo \"== aond-core: \$(systemctl is-active aond-core)\"; systemctl cat aond-core 2>/dev/null | grep -E '^(WorkingDirectory|ExecStart|User|EnvironmentFile)='; journalctl -u aond-core -n 120 --no-pager -o cat | grep -viE 'key|token|secret|password|bearer' | tail -15; echo \"== /opt/aond_core (không phải bản git):\"; du -sh /opt/aond_core/* /opt/aond_core/.[!.]* 2>/dev/null | sort -h | tail -20; echo \"== tên biến .env lõi (không in giá trị):\"; sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\\1/p' /opt/aond_core/.env 2>/dev/null | tr '\\n' ' '; echo; echo \"== khác repo (/opt/nhadat/src/aioi vs /opt/aond_core/src/aioi):\"; diff -rq /opt/nhadat/src/aioi /opt/aond_core/src/aioi 2>&1 | grep -v __pycache__ | head -40; echo \"== cai-vps.sh thoát \$rc_cai\"; exit \$rc_cai" \
            > /tmp/vps.log 2>&1 || rc=$?
          unset SSHPASS PW BS GK AK
          # Che dãy số ≥ 9 chữ số (Zalo ID của acc clone / khách, SĐT) — log repo này công khai.
          sach() { grep -viE "qr-[a-z0-9]|password|secret=" /tmp/vps.log | sed -E 's/[0-9]{9,}/#/g; s/\r//g'; }
          sach | tail -90
          echo "::notice title=cai-vps (thoát $rc)::$(sach | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit $rc

      # 18/10/2026: chủ dự án bỏ bước tự ghi đè VPS_HOST / VPS_ROOT_PASSWORD trong Vault sau mỗi lượt cai-vps ("bỏ cái tự xóa đó đi")
      # — mỗi lượt hỏng là phải nhập lại mật khẩu. Hai secret nay ở lại Vault (chỉ service_role / Management API đọc được).

      # 19/10/2026 (SRS-5.1zzzzzzz71): bắn thử luồng người mua trên lõi Python production bằng ID thử, tự dọn (bot/tests/ban-thu-mua.sh).
      - name: Bắn thử luồng người mua (ban-thu-mua)
        if: ${{ inputs.dung_lai == 'ban-thu-mua' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-mua.sh

      # SRS-5.1zzzzzzz73: bắn thử luồng người bán (ô tin ghi đủ, không ghi ô chủ nhà không nói), ID thử, tự dọn.
      - name: Bắn thử luồng người bán (ban-thu-ban)
        if: ${{ inputs.dung_lai == 'ban-thu-ban' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-ban.sh

      # SRS-5.1zzzzzzz142: ca một tin nhắn hai căn chạy riêng (ban-thu-ban 22/10 trượt vì chờ lưu nền quá ngắn), in thời gian thật tới lúc đủ 2 tin.
      - name: Bắn thử ca một tin nhắn hai căn (ban-thu-nhieu-can)
        if: ${{ inputs.dung_lai == 'ban-thu-nhieu-can' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-nhieu-can.sh

      # SRS-5.1zzzzzzz193: cuộc chat kiểu ảnh chủ dự án 26/10 (nhà phố Hoàng Hoa Thám, sau bản nháp khách nói "hiện có HĐT 35 triệu") — in từng bong bóng, số từ / dấu hỏi mỗi lượt, số lượt tới bản nháp để người đọc chấm độ tự nhiên.
      - name: Bắn thử bot đáp vào ý nghĩa điều khách nói (ban-thu-dap-y)
        if: ${{ inputs.dung_lai == 'ban-thu-dap-y' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-dap-y.sh

      # SRS-5.1zzzzzzz195: CHỈ ĐỌC nhật ký lõi trên VPS trong khoảng giờ UTC ở ô migration_file ("từ|đến") — truy lượt nào làm mất / bỏ ô tin.
      - name: Đọc nhật ký lõi (doc-log-loi)
        if: ${{ inputs.dung_lai == 'doc-log-loi' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          KHOANG: ${{ inputs.migration_file }}
        run: bash bot/tests/doc-log-loi.sh

      # SRS-5.1zzzzzzz153: khách VỪA BÁN VỪA MUA hẹn xem nhà bằng nhiều tin ngắn — lịch hẹn + việc báo người phụ trách + số điện thoại phải vào DB.
      - name: Bắn thử khách vừa bán vừa mua hẹn xem nhà (ban-thu-vm)
        if: ${{ inputs.dung_lai == 'ban-thu-vm' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-vm.sh

      # SRS-5.1zzzzzzz144, 167, 168: nạp rổ tin mẫu seed_thu (SEED0001..0228) bằng SQL, không gọi AI chat; vector do cron nhung-tick nhúng dần. Ảnh: ô nap-anh-mau.
      - name: Nạp rổ tin mẫu (nap-tin-mau)
        if: ${{ inputs.dung_lai == 'nap-tin-mau' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: node bot/tests/tim-nha/nap-tin-mau.mjs

      # SRS-5.1zzzzzzz144: ĐO chất lượng tìm nhà trên rổ mẫu seed_thu (bot/tests/tim-nha/). Chỉ đọc DB; gọi Gemini bằng khoá chính (~60 lượt nhúng).
      - name: Đo tìm nhà (do-tim-nha)
        if: ${{ inputs.dung_lai == 'do-tim-nha' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: node bot/tests/tim-nha/do-tim-nha.mjs

      # SRS-5.1zzzzzzz86: 3 kịch bản tester 20/10 (nhà phân lô mặt ngõ Hà Nội, nhà phố dự án, căn hộ dự án) + chi phí / thời gian.
      - name: Bắn thử 3 kịch bản tester (ban-thu-kb)
        if: ${{ inputs.dung_lai == 'ban-thu-kb' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-kb.sh

      # SRS-5.1zzzzzzz115: địa chỉ có số hẻm của đường đi qua nhiều phường — bot gợi ý đúng phường kho hẻm.
      - name: Bắn thử địa chỉ có số hẻm (ban-thu-dc)
        if: ${{ inputs.dung_lai == 'ban-thu-dc' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-dc.sh

      # SRS-5.1zzzzzzz116: bộ câu môi giới — hỏi thêm sau khi tin lên web, ô riêng của chủ, số khách thật, 7 câu khách mua.
      - name: Bắn thử bộ câu môi giới (ban-thu-sau)
        if: ${{ inputs.dung_lai == 'ban-thu-sau' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-sau.sh

      # SRS-5.1zzzzzzz126: đất ở xã — địa chỉ xã + tỉnh là đủ, không hỏi quận / huyện.
      - name: Bắn thử đất ở xã (ban-thu-xa)
        if: ${{ inputs.dung_lai == 'ban-thu-xa' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: bash bot/tests/ban-thu-xa.sh

      # 18/10/2026 (SRS-5.1zzzzzzz32): chủ dự án "xóa trang chat thử luôn đi" — trang thử chạy bộ não TypeScript đã gỡ. Gỡ đúng
      # những gì bot/tests/chat/cai-vps.sh (đã xoá, xem git) dựng: 3 unit systemd, 2 lệnh /usr/local/bin, /opt/trang-thu,
      # /etc/trang-thu.env|.nhanh, user trangthu. Giữ swapfile và cloudflared (có thể còn việc khác dùng). Không đụng bridge / aond-core.
      - name: Gỡ trang chat thử trên VPS (go-trang-thu)
        if: ${{ inputs.dung_lai == 'go-trang-thu' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          q() { curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg q "$1" '{query:$q}')"; }
          J=$(q "select json_object_agg(name, decrypted_secret) as s from vault.decrypted_secrets where name in ('VPS_HOST','VPS_ROOT_PASSWORD')")
          HOST=$(jq -r '.[0].s.VPS_HOST // empty' <<<"$J"); PW=$(jq -r '.[0].s.VPS_ROOT_PASSWORD // empty' <<<"$J")
          unset J
          for v in "$HOST" "$PW"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          if [ -z "$HOST" ] || [ -z "$PW" ]; then echo "::error::Thiếu VPS_HOST / VPS_ROOT_PASSWORD trong Vault"; exit 1; fi
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$PW"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 "root@$HOST" '
            set -u
            systemctl disable --now trang-thu-cap-nhat.timer trang-thu-cap-nhat.service trang-thu-ham.service trang-thu.service 2>/dev/null || true
            rm -f /etc/systemd/system/trang-thu.service /etc/systemd/system/trang-thu-ham.service \
                  /etc/systemd/system/trang-thu-cap-nhat.service /etc/systemd/system/trang-thu-cap-nhat.timer
            systemctl daemon-reload; systemctl reset-failed 2>/dev/null || true
            rm -f /usr/local/bin/trang-thu-link /usr/local/bin/trang-thu-cap-nhat /etc/trang-thu.env /etc/trang-thu.nhanh
            rm -rf /opt/trang-thu
            id trangthu >/dev/null 2>&1 && userdel -r trangthu 2>/dev/null || true
            echo "== còn unit trang-thu: $(systemctl list-unit-files "trang-thu*" --no-legend | wc -l)"
            echo "== còn /opt/trang-thu: $([ -e /opt/trang-thu ] && echo co || echo khong)"
            echo "== còn user trangthu: $(id trangthu >/dev/null 2>&1 && echo co || echo khong)"
            echo "== bridge: $(systemctl is-active nhadat-bridge) · aond-core: $(systemctl is-active aond-core)"
          '

      # 08/10/2026: project production cũ bị xoá nhầm — dựng lại từng bước trên project mới rỗng.
      - name: Dựng lại DB (dung_lai)
        if: ${{ inputs.dung_lai != '' && inputs.dung_lai != 'nap-du-an' && inputs.dung_lai != 'nap-duong' && inputs.dung_lai != 'nap-giao-lo' && inputs.dung_lai != 'cai-vps' && inputs.dung_lai != 'go-trang-thu' && inputs.dung_lai != 'ban-thu-mua' && inputs.dung_lai != 'ban-thu-ban' && inputs.dung_lai != 'ban-thu-dap-y' && inputs.dung_lai != 'doc-log-loi' && inputs.dung_lai != 'ban-thu-kb' && inputs.dung_lai != 'ban-thu-dc' && inputs.dung_lai != 'ban-thu-sau' && inputs.dung_lai != 'ban-thu-xa' && inputs.dung_lai != 'ban-thu-nhieu-can' && inputs.dung_lai != 'ban-thu-vm' && inputs.dung_lai != 'do-tim-nha' && inputs.dung_lai != 'nap-tin-mau' && inputs.dung_lai != 'nap-anh-mau' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          BUOC: ${{ inputs.dung_lai }}
        run: node scripts/dung-lai-db.mjs "$BUOC"

      - name: Chạy migration qua Supabase Management API
        if: ${{ inputs.dung_lai == '' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          FILE="${{ inputs.migration_file }}"
          [ -n "$FILE" ] || { echo "::error::Thiếu migration_file"; exit 1; }
          TARGET="bot/supabase/migrations/$FILE"
          if [ ! -f "$TARGET" ]; then
            echo "::error::Không tìm thấy file $TARGET"
            exit 1
          fi
          # 30/09/2026: file ĐÃ ÁP thì chặn — áp lại một file cũ là dựng lại hàm/view bản cũ đè bản hiện hành (thân hàm trên
          # DB thường đã khác file cũ, CLAUDE.md §6). Muốn áp lại thật thì gõ "ap lai" ở ô ap_lai.
          NAME0="${FILE%.sql}"
          if ! printf '%s' "$NAME0" | grep -Eq '^[0-9a-z_]+$'; then echo "::error::Tên file lạ: $FILE"; exit 1; fi
          DA=$(curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"query\":\"select count(*)::int as n from supabase_migrations.schema_migrations where name = '$NAME0'\"}" | jq -r '.[0].n')
          if [ "$DA" != "0" ] && [ "${{ inputs.ap_lai }}" != "ap lai" ]; then
            echo "::error::$NAME0 đã áp trên DB rồi. Áp lại sẽ đè hàm/view bằng bản trong file (có thể là bản cũ). Muốn thật thì gõ 'ap lai' ở ô ap_lai."
            exit 1
          fi
          echo "Đang áp migration: $TARGET"
          SQL=$(cat "$TARGET")
          PAYLOAD=$(jq -n --arg q "$SQL" '{query: $q}')
          # `-f`: HTTP ≥400 phải làm job ĐỎ. Bản đầu không có cờ này nên SQL lỗi
          # (Management API trả 400 kèm thông báo) vẫn in "Kết quả: …" và job xanh.
          RES=$(curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Kết quả: $RES"

          # GHI SỔ. Endpoint /database/query chạy SQL trần, KHÔNG ghi vào
          # supabase_migrations.schema_migrations như `apply_migration` của MCP.
          # 20260908e áp qua đường này 08/09 và biến mất khỏi sổ: DB có trigger
          # mà `liet_ke_migration()` không thấy, `soat-migration.mjs` kêu "chưa áp"
          # — đúng hình lỗi OPEN-46, chiều ngược. Tên = tên file bỏ .sql, version =
          # dấu thời gian lúc áp (cùng cách MCP đặt). Chạy lại cùng file thì
          # `on conflict do nothing`, không đẻ dòng trùng.
          NAME="${FILE%.sql}"
          VERSION=$(date -u +%Y%m%d%H%M%S)
          SO=$(jq -n --arg n "$NAME" --arg v "$VERSION" \
            '($n | gsub("'"'"'"; "'"'"''"'"'")) as $qn | ($v | gsub("'"'"'"; "'"'"''"'"'")) as $qv
             | {query: ("insert into supabase_migrations.schema_migrations (version, name, statements) select '"'"'" + $qv + "'"'"', '"'"'" + $qn + "'"'"', array[]::text[] where not exists (select 1 from supabase_migrations.schema_migrations where name = '"'"'" + $qn + "'"'"')")}')
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$SO" >/dev/null
          echo "Đã ghi sổ: $VERSION $NAME"

      # 29/09/2026 (FR-245): sinh lại schema.sql ngay sau khi áp, để phiên làm việc không có service_role vẫn giữ được
      # `schema.sql` khớp DB (cổng CI thứ 7 so md5 từng thân hàm). Chạy `xuat_schema()` qua Management API (cùng token
      # vừa áp), chặn chuỗi giống khoá như scripts/sinh-schema.mjs, rồi để lại dạng artifact — người/máy tải về commit.
      - name: Xuất schema.sql sau khi áp
        if: ${{ inputs.dung_lai == '' || inputs.dung_lai == 'du-lieu' || inputs.dung_lai == 'xac-minh' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"select public.xuat_schema() as s"}' | jq -r '.[0].s' > schema.sql
          test -s schema.sql
          grep -q "SINH TỰ ĐỘNG bởi public.xuat_schema" schema.sql
          if grep -Eq 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|sb_secret_|sk-ant-|gsk_[A-Za-z0-9]{10}' schema.sql; then
            echo "::error::schema.sql có chuỗi giống khoá bí mật — không xuất"
            exit 1
          fi
          wc -l schema.sql

      # FR-245: in SỐ ĐẾM máy soi dữ liệu tin (mã lỗi + số lượng, không nội dung — log repo công khai) để thấy trước/sau
      # một migration sửa dữ liệu. Hàm chưa có thì bỏ qua.
      - name: Số đếm soát dữ liệu tin
        if: ${{ inputs.dung_lai == '' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          Q="select case when to_regprocedure('public.soat_du_lieu_tin()') is null then '\"chưa có hàm\"'::json else (select coalesce(json_agg(x order by x.so desc), '[]'::json) from (select split_part(t.loi, ':', 1) as loi, count(*) as so from public.soat_du_lieu_tin() t group by 1) x) end as dem"
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q}')" | jq -c '.[0].dem'

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dung_lai == '' || inputs.dung_lai == 'du-lieu' || inputs.dung_lai == 'xac-minh' }}
        with:
          name: schema-sql
          path: schema.sql
          retention-days: 3

      # 05/10/2026 (SRS-5.1zzc): phiên Claude / máy mới không tải được artifact (gh nội bộ không theo redirect sang kho blob),
      # mà cổng CI thứ 7 so md5 thân hàm schema.sql ↔ DB — nên khi được bảo, commit thẳng schema.sql về nhánh vừa dispatch.
      # Không có thay đổi thì không commit. Không bao giờ đẩy lên main từ đây (chỉ nhánh đang chạy, và main thì PR lo).
      - name: Commit schema.sql về nhánh
        if: ${{ inputs.commit_schema == 'commit' && github.ref_name != 'main' && (inputs.dung_lai == '' || inputs.dung_lai == 'du-lieu' || inputs.dung_lai == 'xac-minh') }}
        run: |
          set -euo pipefail
          cp schema.sql bot/supabase/schema.sql
          if git diff --quiet -- bot/supabase/schema.sql; then echo "schema.sql không đổi, không commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/supabase/schema.sql
          git commit -m "schema.sql: sinh lại sau khi áp ${{ inputs.migration_file }}${{ inputs.dung_lai }}"
          git push origin "HEAD:${{ github.ref_name }}"
