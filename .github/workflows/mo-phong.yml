name: Khách mô phỏng (persona) chat với bot production

# 11/10/2026 (TS-MO-PHONG-01, SRS-5.1zzzzw): model đóng vai 1–5 kiểu khách (persona.json) chat với chat-reply production bằng Zalo THỬ
# `thu-mp-<mã>` (la_id_thu), rồi chấm: ghi đúng so với bộ sự thật (tất định) + lỗi lời bot (code) + giám khảo AI (lỗi phải trích nguyên
# văn, code kiểm). CHỈ CHẠY TAY, không vào CI: mỗi persona ~10 lượt × (1 lượt khách + ~3 lượt AI của bot) + 1 lượt chấm — tiền thật.
# Repo PUBLIC: persona là người giả, dữ kiện căn bịa sẵn; khoá Anthropic đọc từ Vault và che trong log; dữ liệu thử dọn ở bước cuối.

on:
  workflow_dispatch:
    inputs:
      persona:
        description: "1–5 mã persona, cách nhau dấu phẩy: cut-khong-dau, noi-nhieu, ban-cut, moi-gioi-3-can, nghi-lua, hoi-phi, doi-y, lon-tuoi"
        required: true
        default: 'cut-khong-dau,nghi-lua,doi-y'
      luot:
        description: Số lượt tối đa mỗi persona (2–14)
        required: false
        default: '10'
      model_khach:
        description: Model đóng vai khách
        required: false
        default: 'claude-haiku-4-5-20251001'
      model_cham:
        description: Model giám khảo
        required: false
        default: 'claude-sonnet-5-5'

concurrency: mo-phong

env:
  PROJECT_REF: rqxmmqmctpklqcmbfxuj

jobs:
  mo-phong:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Khách mô phỏng + chấm + dọn
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          PERSONA: ${{ inputs.persona }}
          LUOT: ${{ inputs.luot }}
          MODEL_KHACH: ${{ inputs.model_khach }}
          MODEL_CHAM: ${{ inputs.model_cham }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::Thiếu SUPABASE_ACCESS_TOKEN"; exit 1; fi
          echo "::add-mask::$TOKEN"
          [[ "$PERSONA" =~ ^[a-z0-9,-]{2,200}$ ]] || { echo "::error::mã persona lạ"; exit 1; }
          [[ "$LUOT" =~ ^[0-9]{1,2}$ ]] || { echo "::error::số lượt lạ"; exit 1; }
          for m in "$MODEL_KHACH" "$MODEL_CHAM"; do [[ "$m" =~ ^claude-[a-z0-9.-]{3,60}$ ]] || { echo "::error::model ID lạ"; exit 1; }; done
          K=$(curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d "$(jq -n '{query: "select public.get_secret('"'"'ANTHROPIC_API_KEY'"'"') as k"}')" | jq -r '.[0].k // empty')
          if [ -z "$K" ]; then echo "::error::Vault không có ANTHROPIC_API_KEY"; exit 1; fi
          echo "::add-mask::$K"
          (cd bot/tests/mo-phong && bun install --silent)
          ANTHROPIC_API_KEY="$K" bun bot/tests/mo-phong/mo-phong.mjs --persona "$PERSONA" --luot "$LUOT" --model-khach "$MODEL_KHACH" --model-cham "$MODEL_CHAM"

      - name: Dọn dữ liệu thử (lưới cuối)
        if: always()
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          # SRS-5.1zzzzzd: dọn cả sổ đầu ra model của ID thử (ai_ghi_thu) — reset_nguoi_test không biết bảng đó.
          SQL="with a as (delete from ai_ghi_thu where zalo_user_id like 'thu-mp-%' returning 1) select (select count(*) from a) as ai, count(public.reset_nguoi_test(z)) as n from (select zalo_user_id z from sellers where zalo_user_id like 'thu-mp-%' union select zalo_user_id from buyers where zalo_user_id like 'thu-mp-%') u"
          jq -n --arg q "$SQL" '{query: $q}' | curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @- ; echo
