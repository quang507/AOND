name: Đo bóc tách trên production

# 03/10/2026: bộ đo bóc tách (bot/tests/do-boc, TS-DO-BOC-01) — bắn 110 ca bằng Zalo THỬ `do-*` lên bot production, chấm, dọn.
# Repo PUBLIC: log chỉ in số đếm, mã ca và trường lệch (câu khách là câu soạn sẵn), không in lời bot, không in khoá.

on:
  workflow_dispatch:
    inputs:
      nhom:
        description: Chỉ các nhóm (vd ban1,sua — trống = tất cả)
        required: false
        default: ''
      bo_nhom:
        description: Bỏ các nhóm (vd mua,mua_ban để đo riêng phía bán)
        required: false
        default: ''
      du_bo:
        description: Để trống ô `nhom` là chạy CẢ BỘ (~450 lượt AI (149 tin × 3, chưa kể hỏi bù), tốn credit). Muốn vậy thật thì gõ đúng chữ "ca bo".
        required: false
        default: ''

concurrency: do-boc

env:
  PROJECT_REF: rqxmmqmctpklqcmbfxuj

jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bắn + chấm + dọn
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          NHOM: ${{ inputs.nhom }}
          BO_NHOM: ${{ inputs.bo_nhom }}
          DU_BO: ${{ inputs.du_bo }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Thiếu SUPABASE_ACCESS_TOKEN"; exit 1; fi
          echo "::add-mask::$TOKEN"
          for v in "$NHOM" "$BO_NHOM"; do [[ "$v" =~ ^[a-z0-9_,]*$ ]] || { echo "::error::tên nhóm lạ"; exit 1; }; done
          # 04/10/2026 (SRS-5.1zw, chủ dự án: cắt tiền test): mỗi tin ≈ 3 lượt AI. In ước lượng trước khi bắn; chạy CẢ BỘ
          # (ô nhom trống) phải gõ "ca bo" — bộ e2e offline 912 ca là miễn phí, bộ này là tiền thật.
          node -e '
            const fs = require("fs");
            const nhom = (process.env.NHOM || "").split(",").filter(Boolean), bo = (process.env.BO_NHOM || "").split(",").filter(Boolean);
            const ca = fs.readFileSync("bot/tests/do-boc/ca.jsonl", "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l))
              .filter((c) => (!nhom.length || nhom.includes(c.nhom)) && !bo.includes(c.nhom));
            const tin = ca.reduce((s, c) => s + c.luot.length, 0);
            console.log(`Ước lượng: ${ca.length} ca · ${tin} tin · ~${tin * 3} lượt AI (3 lượt/tin, chưa kể hỏi bù).`);
          '
          if [ -z "$NHOM" ] && [ "$DU_BO" != "ca bo" ]; then
            echo "::error::Ô nhom trống = chạy CẢ BỘ, tốn credit thật. Chọn nhóm (vd ban1,sua) hoặc gõ đúng \"ca bo\" vào ô du_bo."; exit 1
          fi
          A=(); [ -n "$NHOM" ] && A+=(--nhom "$NHOM"); [ -n "$BO_NHOM" ] && A+=(--bo-nhom "$BO_NHOM")
          node bot/tests/do-boc/ban-production.mjs "${A[@]}"
