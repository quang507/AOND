[project]
name = "aioi"
version = "0.1.0"
description = "AI Ơi Nhà Đất — conversational real-estate assistant (aioinhadat.com)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pillow>=10",
    "openpyxl>=3.1",
    "httpx>=0.27",        # voice.py tải ghi âm — trước chỉ có nhờ anthropic kéo theo
    "numpy>=1.24",        # xoa_logo.py (SRS-5.1zzzzzzz454) — thiếu thì chỉ đóng dấu, không xoá logo
    "opencv-python-headless>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aioi = ["tai_nguyen/*.png"]   # logo đóng dấu ảnh (xoa_logo.py)

