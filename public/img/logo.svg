       chuyển màu đỏ gạch → xanh ngọc → xanh dương, ô vuông có tia lấp lánh góc trái trên.
       Muốn dùng đúng file gốc: thả PNG vào public/img/logo.png và đổi src trong components/Logo.tsx. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#b8321a"/>
